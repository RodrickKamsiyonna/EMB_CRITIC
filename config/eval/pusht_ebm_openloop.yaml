defaults:
  - launcher: local
  - solver: ebm_gd
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42
policy: ebm_wm # checkpoint path relative to $STABLEWM_HOME without _object.ckpt

# Open-loop: receding_horizon == horizon (plan full horizon once, decode all actions via IDM)
plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  filename: pusht_ebm_openloop_results.txt
